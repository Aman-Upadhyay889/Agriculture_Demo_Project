<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Root of Life</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Landing Page -->
    <section class="hero">

        <!-- Left Content -->
        <div class="hero-content">

            <p class="small-title">SMART AGRICULTURE</p>

            <h1>
                The <span>Root</span><br>
                of Life
            </h1>

            <p class="description">
                Where technology meets the soil,
                and every seed grows towards a better tomorrow.
            </p>

            <button class="explore-btn" onclick="startJourney()">
                Explore the Farm →
            </button>

        </div>


        <!-- Right Illustration -->
        <div class="farm-illustration">

            <div class="sun"></div>

            <!-- Clouds -->
            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>

            <!-- Tree -->
            <div class="tree">
                <div class="trunk"></div>

                <div class="tree-top top-one"></div>
                <div class="tree-top top-two"></div>
                <div class="tree-top top-three"></div>
            </div>

            <!-- Growing Crop -->
            <div class="crop crop-one">
                <div class="stem"></div>
                <div class="leaf left"></div>
                <div class="leaf right"></div>
            </div>

            <div class="crop crop-two">
                <div class="stem"></div>
                <div class="leaf left"></div>
                <div class="leaf right"></div>
            </div>

            <div class="crop crop-three">
                <div class="stem"></div>
                <div class="leaf left"></div>
                <div class="leaf right"></div>
            </div>

            <!-- Soil -->
            <div class="soil">
                <div class="soil-line"></div>
                <div class="soil-line line-two"></div>
                <div class="soil-line line-three"></div>
            </div>

        </div>

    </section>


    <!-- Bottom Message -->
    <section class="bottom-section">

        <div class="bottom-text">
            <span class="line"></span>

            <h2>Life &amp; Soil</h2>

            <p>
                Every life begins with a seed.
                Every seed begins with soil.
            </p>
        </div>

        <div class="leaf-decoration">
            🌿
        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
